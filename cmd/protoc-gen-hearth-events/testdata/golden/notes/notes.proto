// The notes golden case: a service that writes, lists and reads notes, an event
// whose message carries a selector, an event whose message carries none, and an
// event whose message is nested in another message.
syntax = "proto3";

package frostyard.notes.v1;

import "frostyard/hearth/v1/options.proto";

option go_package = "example.com/notesv1;notesv1";

// Note is 1 note, filed in a group.
message Note {
  // id identifies the note.
  string id = 1;
  // group is the selector the note is filed under.
  string group = 2 [(frostyard.hearth.v1.hearth_selector) = "group"];
}

// GetRequest names the note to read.
message GetRequest {
  // id identifies the note.
  string id = 1;
}

// GetResponse carries the note that was read.
message GetResponse {
  // note is the note that was read.
  Note note = 1;
}

// ListRequest names the group to list.
message ListRequest {
  // group is the selector the notes are filed under.
  string group = 1 [(frostyard.hearth.v1.hearth_selector) = "group"];
}

// ListResponse carries the notes of a group.
message ListResponse {
  // notes are the notes of the group.
  repeated Note notes = 1;
}

// CreateRequest carries the note to write.
message CreateRequest {
  // note is the note to write.
  Note note = 1;
}

// CreateResponse carries the note that was written.
message CreateResponse {
  // note is the note that was written.
  Note note = 1;
}

// NoteCreated is published when a note is created.
message NoteCreated {
  option (frostyard.hearth.v1.hearth_event) = {
    object: "note"
    verb: "created"
    selector: "group"
    read_permission: "notes:read"
  };
  // id identifies the note.
  string id = 1;
}

// NotePublished is published when a note leaves the system.
message NotePublished {
  option (frostyard.hearth.v1.hearth_event) = {
    object: "note"
    verb: "published"
    read_permission: "notes:publish"
  };
  // id identifies the note.
  string id = 1;
}

// Lifecycle is the message of 1 note's later life, and it holds the events of a
// note that leaves a group.
message Lifecycle {
  // Archived is published when a note is archived.
  message Archived {
    option (frostyard.hearth.v1.hearth_event) = {
      object: "note"
      verb: "archived"
      selector: "group"
      read_permission: "notes:read"
    };
    // id identifies the note.
    string id = 1;
  }
}

// Notes serves notes.
service Notes {
  // Get reads 1 note.
  rpc Get(GetRequest) returns (GetResponse) {
    option (frostyard.hearth.v1.hearth_rpc) = {
      permission: "notes:read"
      effect: EFFECT_READ
      expose: EXPOSE_UI
    };
  }
  // List reads the notes of 1 group.
  rpc List(ListRequest) returns (ListResponse) {
    option (frostyard.hearth.v1.hearth_rpc) = {
      permission: "notes:read"
      effect: EFFECT_READ
      expose: EXPOSE_UI
    };
  }
  // Create writes 1 note.
  rpc Create(CreateRequest) returns (CreateResponse) {
    option (frostyard.hearth.v1.hearth_rpc) = {
      permission: "notes:write"
      effect: EFFECT_WRITE
      expose: EXPOSE_UI
    };
  }
}
