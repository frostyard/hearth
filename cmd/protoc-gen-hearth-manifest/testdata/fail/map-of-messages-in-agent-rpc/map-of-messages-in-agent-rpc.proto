// The map-of-messages-in-agent-rpc case: an agent RPC whose request has a map
// of messages.
syntax = "proto3";

package frostyard.fail.v1;

import "frostyard/hearth/v1/options.proto";

option go_package = "example.com/fail/v1;failv1";

// Thing is 1 thing.
message Thing {
  // id identifies the thing.
  string id = 1;
}

// PutAllRequest carries things by name.
message PutAllRequest {
  // things are the things to put.
  map<string, Thing> things = 1;
}

// PutAllResponse reports the put.
message PutAllResponse {}

// ThingService serves things.
service ThingService {
  // PutAll puts many things.
  rpc PutAll(PutAllRequest) returns (PutAllResponse) {
    option (frostyard.hearth.v1.hearth_rpc) = {
      permission: "fail:write"
      effect: EFFECT_WRITE
      expose: EXPOSE_AGENT
    };
  }
}
