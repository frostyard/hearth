// The streaming-agent-rpc case: an agent RPC that streams its response.
syntax = "proto3";

package frostyard.fail.v1;

import "frostyard/hearth/v1/options.proto";

option go_package = "example.com/fail/v1;failv1";

// WatchRequest names what to watch.
message WatchRequest {
  // id identifies the thing.
  string id = 1;
}

// WatchResponse carries 1 thing.
message WatchResponse {
  // thing is what changed.
  string thing = 1;
}

// ThingService serves things.
service ThingService {
  // Watch streams the changes of 1 thing.
  rpc Watch(WatchRequest) returns (stream WatchResponse) {
    option (frostyard.hearth.v1.hearth_rpc) = {
      permission: "fail:read"
      effect: EFFECT_READ
      expose: EXPOSE_AGENT
    };
  }
}
