// The selector-not-string case: a selector on a number.
syntax = "proto3";

package frostyard.fail.v1;

import "frostyard/hearth/v1/options.proto";

option go_package = "example.com/fail/v1;failv1";

// ListThingsRequest names the folder to list.
message ListThingsRequest {
  // folder is the folder's number.
  int32 folder = 1 [(frostyard.hearth.v1.hearth_selector) = "folder"];
}

// ListThingsResponse carries the things of the folder.
message ListThingsResponse {
  // things are the things of the folder.
  repeated string things = 1;
}

// ThingService serves things.
service ThingService {
  // ListThings lists the things of 1 folder.
  rpc ListThings(ListThingsRequest) returns (ListThingsResponse) {
    option (frostyard.hearth.v1.hearth_rpc) = {
      permission: "fail:read"
      effect: EFFECT_READ
      expose: EXPOSE_UI
    };
  }
}
