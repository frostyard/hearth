// The demo golden case: agent RPCs of all 3 effects, 1 RPC with an agent
// description and an example, 1 RPC whose description is its comment, and 1
// RPC that only the UI reaches.
syntax = "proto3";

package frostyard.demo.v1;

import "frostyard/hearth/v1/options.proto";

option go_package = "example.com/demov1;demov1";

// Note is 1 note, filed in a group.
message Note {
  // id identifies the note.
  string id = 1;
  // group is the selector the note is filed under.
  string group = 2 [(frostyard.hearth.v1.hearth_selector) = "group"];
}

// GetRequest names the note to read.
message GetRequest {
  // id identifies the note.
  string id = 1;
}

// GetResponse carries the note that was read.
message GetResponse {
  // note is the note that was read.
  Note note = 1;
}

// ListRequest names the group to list.
message ListRequest {
  // group is the selector the notes are filed under.
  string group = 1 [(frostyard.hearth.v1.hearth_selector) = "group"];
}

// ListResponse carries the notes of a group.
message ListResponse {
  // notes are the notes of the group.
  repeated Note notes = 1;
}

// CreateRequest carries the note to write.
message CreateRequest {
  // note is the note to write.
  Note note = 1;
}

// CreateResponse carries the note that was written.
message CreateResponse {
  // note is the note that was written.
  Note note = 1;
}

// PublishRequest names the note to publish.
message PublishRequest {
  // id identifies the note.
  string id = 1;
}

// PublishResponse reports the publication.
message PublishResponse {
  // url is where the note was published.
  string url = 1;
}

// WatchRequest asks for the notes of a group.
message WatchRequest {}

// WatchResponse carries the notes that changed.
message WatchResponse {
  // notes are the notes that changed.
  repeated Note notes = 1;
}

// Notes serves notes.
service Notes {
  // Get reads 1 note.
  rpc Get(GetRequest) returns (GetResponse) {
    option (frostyard.hearth.v1.hearth_rpc) = {
      permission: "demo:read"
      effect: EFFECT_READ
      expose: EXPOSE_UI
      expose: EXPOSE_AGENT
      agent_description: "Read 1 note by its id."
      examples: "{\"id\": \"n-1\"}"
    };
  }
  // List reads the notes of 1 group.
  rpc List(ListRequest) returns (ListResponse) {
    option (frostyard.hearth.v1.hearth_rpc) = {
      permission: "demo:read"
      effect: EFFECT_READ
      expose: EXPOSE_UI
      expose: EXPOSE_AGENT
    };
  }
  // Create writes a note.
  rpc Create(CreateRequest) returns (CreateResponse) {
    option (frostyard.hearth.v1.hearth_rpc) = {
      permission: "demo:write"
      effect: EFFECT_WRITE
      expose: EXPOSE_UI
      expose: EXPOSE_AGENT
      agent_description: "Create a note in a group."
      examples: "{\"note\": {\"group\": \"/inbox\"}}"
      examples: "{\"note\": {\"group\": \"/work/2026\"}}"
    };
  }
  // Publish sends a note out of the system.
  rpc Publish(PublishRequest) returns (PublishResponse) {
    option (frostyard.hearth.v1.hearth_rpc) = {
      permission: "demo:publish"
      effect: EFFECT_OUTWARD
      expose: EXPOSE_UI
      expose: EXPOSE_AGENT
      agent_description: "Publish a note to the outside world."
    };
  }
  // Watch reads the notes that changed.
  rpc Watch(WatchRequest) returns (WatchResponse) {
    option (frostyard.hearth.v1.hearth_rpc) = {
      permission: "demo:read"
      effect: EFFECT_READ
      expose: EXPOSE_UI
    };
  }
}
