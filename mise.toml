# Tool pins for this repository (frostyard/core ADR-0043). Go comes from
# go.mod's go line; never pin it here. mise.lock carries each tool's
# checksums: `mise install` provisions exactly these versions locally and in
# CI.
[settings]
idiomatic_version_file_enable_tools = ["go"]
lockfile = true

[tools]
# make lint, and so make verify, check and ci; the Makefile checks this release.
golangci-lint = "2.15.0"
# make verify lints and formats the proto files; buf and make generate use the
# local plugin.
buf = "1.75.0"
# make generate runs this plugin locally (no remote BSR plugin runs).
protoc-gen-go = "1.36.12"
# make bump tags the release with svu; the Makefile checks this release.
svu = "3.4.1"
