# Generate the Go code of hearth's options (make generate). The plugin is the
# local protoc-gen-go that mise installs; no remote BSR plugin runs
# (frostyard/core ADR-0085). paths=source_relative keeps the output tree equal
# to the proto tree.
version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
