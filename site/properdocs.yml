# yaml-language-server: $schema=https://jaywhj.github.io/mkdocs-materialx/schema.json
# The hearth documentation site: ProperDocs with the MaterialX theme. The
# layout comes from frostyard/core ADR-0070. `make site` builds it into
# site/dist; `make site-serve` previews it at
# http://127.0.0.1:8000/hearth/.

site_name: hearth
site_url: https://frostyard.github.io/hearth/
site_description: The Protobuf options, plugins and Go runtime that give a first-party app its API, MCP tools, permissions, events and manifest.
site_author: Frostyard
copyright: hearth is MIT licensed. Part of <a href="https://frostyard.org">Frostyard</a>.

repo_name: frostyard/hearth
repo_url: https://github.com/frostyard/hearth
edit_uri: edit/main/site/content/

docs_dir: content
site_dir: dist

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Get started:
      - Install: getting-started/install.md
  - Guides:
      - The options: guides/options.md
      - The manifest: guides/manifest.md
  - Reference:
      - Manifest format: reference/manifest.md
      - Commands: reference/cli.md
  - Contributing:
      - Build from source: contributing/build.md

theme:
  name: materialx
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  font: false
  # Frostyard surfaces are solid; no frosted-glass header.
  topbar_style: primary
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - search.highlight
    - search.share
    - toc.follow

plugins:
  - search

extra_css:
  - stylesheets/frostyard.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/frostyard/hearth
      name: hearth on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
