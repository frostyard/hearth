# Dependabot (frostyard/core ADR-0071 row B13, ADR-0075 and ADR-0089).
# Each ecosystem has 1 entry. The gomod entry lists the root module and the
# example app's own module (docs/adr/0009) in directories. Each entry has a
# monthly schedule and 1 group with `patterns: ["*"]`, so each ecosystem
# opens at most 1 version-update PR a month. The groups have no `applies-to`,
# so security updates stay immediate, with 1 PR each.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/examples/notes-lite"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go:
        patterns: ["*"]
